services:
  tickbell:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: wishmelz/tickbell:latest
    container_name: tickbell
    restart: unless-stopped
    ports:
      # 宿主机仅暴露一个端口（同时托管前端页面与 /api 接口）
      - "0.0.0.0:${PORT:-3000}:${PORT:-3000}"
    # 无需填写密码或密钥；首次启动打开网页设置并自动保存在 ./data/tickbell.db 中
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-3000}"
      DB_PATH: "${DB_PATH:-/data/tickbell.db}"
      BACKUP_DIR: "${BACKUP_DIR:-/data/backups}"
    volumes:
      # 挂载整个目录（同时持久化 tickbell.db、-wal/-shm 以及 backups/）
      # Linux 宿主机首次启动前建议执行：mkdir -p ./data && chown -R 1000:1000 ./data
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
