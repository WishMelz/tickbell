# TickBell 单文件快速部署模板（无需下载源码，单端口同时托管前端与 API）
#
# 使用方式（Linux 服务器）：
#   mkdir -p ./data && chown -R 1000:1000 ./data
#   docker compose up -d
#
# 升级镜像：
#   docker compose pull && docker compose up -d

services:
  tickbell:
    image: wishmelz/tickbell:latest
    container_name: tickbell
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口（如需改对外端口，直接修改左侧，例如 "0.0.0.0:8080:3000"）
      # 若同机前方有 Nginx / Caddy / 1Panel 反代，建议改为 "127.0.0.1:3000:3000"
      - "0.0.0.0:3000:3000"
    volumes:
      # 挂载整个数据目录，同时持久化 tickbell.db、WAL 文件及每日 backups/
      - ./data:/data
    environment:
      PORT: "3000"
      DB_PATH: "/data/tickbell.db"
      BACKUP_DIR: "/data/backups"
      # 可选配置（默认已适配常见场景，按需取消注释修改）：
      # COOKIE_SECURE: "auto"          # auto 自动识别 HTTP/HTTPS；纯 HTTPS 反代可改 true
      # ALLOW_PRIVATE_URLS: "true"     # 允许推送到内网 / Docker 自建通知服务（如自建 Bark）
      # MAX_REMINDERS: "500"           # 提醒条数上限
      # MISSED_GRACE_MINUTES: "60"     # 服务重启错过提醒的补发宽限窗口（分钟）
      # DELIVERY_RETENTION_DAYS: "90"  # 投递日志保留天数
      # BACKUP_KEEP_DAYS: "14"         # 每日 SQLite 自动备份保留天数
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
